# Remap CapsLock on every keyboard (any device that reports KEY_CAPSLOCK).
#
# No LINK filter is needed: the loop guard is that the output descriptions
# (keyboard.yaml, thinkpad-bluetooth.yaml) do not declare KEY_CAPSLOCK, so these
# jobs never match (and re-grab) their own uinput output; the remap emits
# KEY_LEFTCTRL, never CapsLock.
#
# The ThinkPad Bluetooth keyboard is matched first so its TrackPoint is routed
# through a distinctly named output it can be targeted by in Hyprland. All other
# keyboards fall through to the generic job. Only the first matching job runs.
- JOB: intercept -g $DEVNODE | dual-function-keys -c /etc/interception/capslock-ctrl.yaml | uinput -c /etc/interception/thinkpad-bluetooth.yaml
  DEVICE:
    NAME: .*ThinkPad Compact Bluetooth Keyboard.*
    EVENTS:
      EV_KEY: [KEY_CAPSLOCK]

- JOB: intercept -g $DEVNODE | dual-function-keys -c /etc/interception/capslock-ctrl.yaml | uinput -c /etc/interception/keyboard.yaml
  DEVICE:
    EVENTS:
      EV_KEY: [KEY_CAPSLOCK]
